<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>terminal.svg preview — img context, light & dark</title>
<style>
  body { margin: 0; font-family: system-ui; }
  section { padding: 32px; display: flex; justify-content: center; }
  .light { background: #ffffff; }
  .dark  { background: #0d1117; }
  img { max-width: 100%; height: auto; }
</style>
</head>
<body>
  <section class="light"><img src="terminal.svg" alt="light theme preview"></section>
  <section class="dark"><img src="terminal.svg" alt="dark theme preview"></section>
</body>
</html>
